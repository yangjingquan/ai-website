# Loaded by the port 443 shop-nginx container.
server {
    listen 443 ssl;
    server_name www.nexbyte.top;

    ssl_certificate     /etc/nginx/ssl/www.nexbyte.top.pem;
    ssl_certificate_key /etc/nginx/ssl/www.nexbyte.top.key;

    location / {
        proxy_pass http://103.47.83.185:18081;
        proxy_http_version 1.1;
        proxy_set_header Host www.nexbyte.top;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host www.nexbyte.top;
        proxy_set_header X-Forwarded-Port 443;
    }
}

server {
    listen 443 ssl;
    server_name nexbyte.top;

    ssl_certificate     /etc/nginx/ssl/www.nexbyte.top.pem;
    ssl_certificate_key /etc/nginx/ssl/www.nexbyte.top.key;
    return 301 https://www.nexbyte.top$request_uri;
}
